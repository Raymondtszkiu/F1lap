<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 // LIVE COMMAND CENTER</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #000; color: #fff; font-family: monospace; overflow: hidden; }
  </style>
</head>
<body class="bg-black text-white font-mono select-none h-screen w-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const formatLapTime = (sec) => {
      if (sec === null || isNaN(sec)) return '--:--.---';
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(3);
      return `${m}:${s.padStart(6, '0')}`;
    };

    function App() {
      const [delayOffset, setDelayOffset] = useState(30);
      const [sessionName, setSessionName] = useState('LIVE SESSION');
      const [circuitName, setCircuitName] = useState('CIRCUIT');
      
      const [drivers, setDrivers] = useState({});
      const [circuitPath, setCircuitPath] = useState([]);
      const [activeCarData, setActiveCarData] = useState({});
      const [activeIntervals, setActiveIntervals] = useState({});
      const [activeLaps, setActiveLaps] = useState({});
      const [bestLapSec, setBestLapSec] = useState(null);
      const [activeStints, setActiveStints] = useState({});
      const [activeLocations, setActiveLocations] = useState({});
      const [activeRaceControl, setActiveRaceControl] = useState(null);
      const [activeRadios, setActiveRadios] = useState({});
      const [positionsHistory, setPositionsHistory] = useState([]);

      const bufferCarData = useRef([]);
      const bufferIntervals = useRef([]);
      const bufferLaps = useRef([]);
      const bufferLocations = useRef([]);
      const bufferPositions = useRef([]);
      const bufferRadio = useRef([]);
      const bufferRC = useRef([]);

      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      // 1. 初始化賽事基礎資料
      useEffect(() => {
        async function initStatic() {
          try {
            const sessRes = await fetch('https://api.openf1.org/v1/sessions?session_key=latest');
            const sessJson = await sessRes.json();
            if (sessJson?.length > 0) {
              setSessionName(sessJson[sessJson.length - 1].session_name || 'RACE');
              setCircuitName(sessJson[sessJson.length - 1].circuit_short_name || 'CIRCUIT');
            }

            const meetRes = await fetch('https://api.openf1.org/v1/meetings?year=latest');
            const meetJson = await meetRes.json();
            if (meetJson?.length > 0 && meetJson[meetJson.length - 1].circuit_info_url) {
              const trackRes = await fetch(meetJson[meetJson.length - 1].circuit_info_url);
              const trackJson = await trackRes.json();
              if (trackJson?.x && trackJson?.y) {
                setCircuitPath(trackJson.x.map((xVal, i) => ({ x: xVal, y: trackJson.y[i] })));
              }
            }

            const dRes = await fetch('https://api.openf1.org/v1/drivers?session_key=latest');
            const dJson = await dRes.json();
            if (Array.isArray(dJson)) {
              const dMap = {};
              dJson.forEach(d => {
                dMap[d.driver_number] = {
                  ...d,
                  team_colour: d.team_colour ? `#${d.team_colour}` : '#FFFFFF'
                };
              });
              setDrivers(dMap);
            }
          } catch (e) { console.error('Init Error', e); }
        }
        initStatic();
      }, []);

      // 2. 數據拉取輪詢
      useEffect(() => {
        const fetchHighFreq = async () => {
          try {
            const [cRes, lRes] = await Promise.all([
              fetch('https://api.openf1.org/v1/car_data?session_key=latest'),
              fetch('https://api.openf1.org/v1/location?session_key=latest')
            ]);
            const [cJ, lJ] = await Promise.all([cRes.json(), lRes.json()]);
            if (Array.isArray(cJ)) bufferCarData.current.push(...cJ);
            if (Array.isArray(lJ)) bufferLocations.current.push(...lJ);
          } catch (e) {}
        };

        const fetchMidFreq = async () => {
          try {
            const [lapRes, intRes, rcRes, radRes, posRes, stintRes] = await Promise.all([
              fetch('https://api.openf1.org/v1/laps?session_key=latest'),
              fetch('https://api.openf1.org/v1/intervals?session_key=latest'),
              fetch('https://api.openf1.org/v1/race_control?session_key=latest'),
              fetch('https://api.openf1.org/v1/team_radio?session_key=latest'),
              fetch('https://api.openf1.org/v1/position?session_key=latest'),
              fetch('https://api.openf1.org/v1/stints?session_key=latest')
            ]);
            const [lapJ, intJ, rcJ, radJ, posJ, stintJ] = await Promise.all([
              lapRes.json(), intRes.json(), rcRes.json(), radRes.json(), posRes.json(), stintRes.json()
            ]);

            if (Array.isArray(lapJ)) bufferLaps.current.push(...lapJ);
            if (Array.isArray(intJ)) bufferIntervals.current.push(...intJ);
            if (Array.isArray(rcJ)) bufferRC.current.push(...rcJ);
            if (Array.isArray(radJ)) bufferRadio.current.push(...radJ);
            if (Array.isArray(posJ)) bufferPositions.current.push(...posJ);

            if (Array.isArray(stintJ)) {
              const sMap = {};
              stintJ.forEach(s => {
                if (!sMap[s.driver_number]) sMap[s.driver_number] = [];
                sMap[s.driver_number].push(s);
              });
              setActiveStints(sMap);
            }
          } catch (e) {}
        };

        const hf = setInterval(fetchHighFreq, 1000);
        const mf = setInterval(fetchMidFreq, 3000);
        return () => { clearInterval(hf); clearInterval(mf); };
      }, []);

      // 3. 延遲釋放引擎
      useEffect(() => {
        const drain = setInterval(() => {
          const targetTime = Date.now() - delayOffset * 1000;
          const extract = (bufferRef) => {
            const idx = bufferRef.current.findIndex(i => new Date(i.date).getTime() > targetTime);
            if (idx === -1) {
              const items = [...bufferRef.current];
              bufferRef.current = [];
              return items;
            } else if (idx > 0) {
              const items = bufferRef.current.slice(0, idx);
              bufferRef.current = bufferRef.current.slice(idx);
              return items;
            }
            return [];
          };

          const rCar = extract(bufferCarData);
          if (rCar.length > 0) {
            setActiveCarData(p => {
              const next = { ...p };
              rCar.forEach(c => { next[c.driver_number] = c; });
              return next;
            });
          }

          const rLoc = extract(bufferLocations);
          if (rLoc.length > 0) {
            setActiveLocations(p => {
              const next = { ...p };
              rLoc.forEach(l => { next[l.driver_number] = l; });
              return next;
            });
          }

          const rInt = extract(bufferIntervals);
          if (rInt.length > 0) {
            setActiveIntervals(p => {
              const next = { ...p };
              rInt.forEach(i => { next[i.driver_number] = i; });
              return next;
            });
          }

          const rLaps = extract(bufferLaps);
          if (rLaps.length > 0) {
            setActiveLaps(p => {
              const next = { ...p };
              let minLap = bestLapSec;
              rLaps.forEach(l => {
                next[l.driver_number] = l;
                if (l.lap_duration && (!minLap || l.lap_duration < minLap)) minLap = l.lap_duration;
              });
              setBestLapSec(minLap);
              return next;
            });
          }

          const rRC = extract(bufferRC);
          if (rRC.length > 0) setActiveRaceControl(rRC[rRC.length - 1]);

          const rRad = extract(bufferRadio);
          if (rRad.length > 0) {
            setActiveRadios(p => {
              const next = { ...p };
              rRad.forEach(r => { next[r.driver_number] = r.recording_url; });
              return next;
            });
          }

          const rPos = extract(bufferPositions);
          if (rPos.length > 0) {
            setPositionsHistory(p => {
              const latest = [...p];
              rPos.forEach(pos => {
                const timeTag = new Date(pos.date).toLocaleTimeString();
                let entry = latest.find(e => e.time === timeTag);
                if (!entry) { entry = { time: timeTag }; latest.push(entry); }
                entry[`D_${pos.driver_number}`] = pos.position;
              });
              return latest.slice(-30);
            });
          }
        }, 250);

        return () => clearInterval(drain);
      }, [delayOffset, bestLapSec]);

      // 4. Canvas 賽道繪製
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        let animId;

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (circuitPath.length > 0) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            circuitPath.forEach(p => {
              if (p.x < minX) minX = p.x;
              if (p.x > maxX) maxX = p.x;
              if (p.y < minY) minY = p.y;
              if (p.y > maxY) maxY = p.y;
            });

            const pad = 20;
            const scale = Math.min((canvas.width - pad * 2) / (maxX - minX || 1), (canvas.height - pad * 2) / (maxY - minY || 1));
            const transX = (val) => pad + (val - minX) * scale;
            const transY = (val) => canvas.height - (pad + (val - minY) * scale);

            ctx.beginPath();
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2.5;
            circuitPath.forEach((p, i) => {
              const x = transX(p.x), y = transY(p.y);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.stroke();

            Object.entries(activeLocations).forEach(([dNum, loc]) => {
              const dMeta = drivers[dNum];
              const isPit = activeLaps[dNum]?.is_pit_out_lap;
              const x = transX(loc.x), y = transY(loc.y);

              ctx.beginPath();
              ctx.arc(x, y, 5, 0, 2 * Math.PI);
              ctx.fillStyle = isPit ? '#00f0ff' : (dMeta?.team_colour || '#FFF');
              ctx.fill();

              ctx.font = '9px monospace';
              ctx.fillStyle = '#FFF';
              ctx.fillText(dMeta?.name_acronym || dNum, x + 6, y + 3);
            });
          }
          animId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animId);
      }, [circuitPath, activeLocations, drivers, activeLaps]);

      // 5. 名次折線圖 (Chart.js)
      useEffect(() => {
        if (!chartRef.current || positionsHistory.length === 0) return;
        const ctx = chartRef.current.getContext('2d');
        
        const datasets = Object.values(drivers).map(d => ({
          label: d.name_acronym,
          data: positionsHistory.map(h => h[`D_${d.driver_number}`] || null),
          borderColor: d.team_colour,
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.2
        }));

        if (chartInstanceRef.current) {
          chartInstanceRef.current.data.labels = positionsHistory.map(h => h.time);
          chartInstanceRef.current.data.datasets = datasets;
          chartInstanceRef.current.update('none');
        } else {
          chartInstanceRef.current = new Chart(ctx, {
            type: 'line',
            data: { labels: positionsHistory.map(h => h.time), datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { reverse: true, min: 1, max: 20, grid: { color: '#1a1a1a' }, ticks: { color: '#666' } },
                x: { display: false }
              },
              plugins: { legend: { display: false } },
              animation: false
            }
          });
        }
      }, [positionsHistory, drivers]);

      const sortedDrivers = useMemo(() => {
        return Object.values(drivers).sort((a, b) => {
          const posA = positionsHistory[positionsHistory.length - 1]?.[`D_${a.driver_number}`] || 99;
          const posB = positionsHistory[positionsHistory.length - 1]?.[`D_${b.driver_number}`] || 99;
          return posA - posB;
        });
      }, [drivers, positionsHistory]);

      return (
        <div className="flex flex-col h-screen w-screen bg-black text-white font-mono select-none overflow-hidden">
          {/* Header */}
          <header className="h-10 border-b border-[#222] flex items-center justify-between px-4 bg-[#0a0a0a] shrink-0">
            <div className="flex items-center space-x-3">
              <span className="font-black text-red-600 text-sm tracking-widest">F1 // COMMAND</span>
              <span className="text-xs text-neutral-400">[{sessionName.toUpperCase()} - {circuitName.toUpperCase()}]</span>
            </div>

            {activeRaceControl && (
              <div>
                {activeRaceControl.flag === 'RED' && <span className="bg-red-600 text-white font-bold px-3 py-0.5 text-xs">RED FLAG</span>}
                {activeRaceControl.category === 'SafetyCar' && (
                  <span className="bg-yellow-400 text-black font-bold px-3 py-0.5 text-xs">
                    {activeRaceControl.message?.includes('VIRTUAL') ? 'VSC DEPLOYED' : 'SAFETY CAR'}
                  </span>
                )}
              </div>
            )}

            <div className="flex items-center space-x-2 text-xs">
              <span className="text-neutral-500">DELAY:</span>
              <input
                type="range" min="0" max="90" value={delayOffset}
                onChange={e => setDelayOffset(Number(e.target.value))}
                className="w-24 h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-red-600"
              />
              <span className="w-8 text-right font-bold text-neutral-300">{delayOffset}s</span>
            </div>
          </header>

          {/* Body */}
          <div className="flex-1 grid grid-cols-12 gap-1 p-1 overflow-hidden">
            {/* Table */}
            <div className="col-span-8 bg-[#050505] border border-[#1a1a1a] flex flex-col overflow-hidden">
              <div className="grid grid-cols-12 gap-1 bg-[#111] p-1 text-[10px] text-neutral-400 border-b border-[#222] font-semibold text-center shrink-0">
                <span className="col-span-1">POS</span>
                <span className="col-span-2 text-left pl-1">DRIVER / THR</span>
                <span className="col-span-2">GAP / INT</span>
                <span className="col-span-1">TYRE</span>
                <span className="col-span-2">LAST (SPD)</span>
                <span className="col-span-3">MINI SECTORS</span>
                <span className="col-span-1">STATUS</span>
              </div>

              <div className="flex-1 overflow-y-auto divide-y divide-[#151515]">
                {sortedDrivers.map((driver, index) => {
                  const car = activeCarData[driver.driver_number];
                  const interval = activeIntervals[driver.driver_number];
                  const lap = activeLaps[driver.driver_number];
                  const stints = activeStints[driver.driver_number];
                  const currentStint = stints ? stints[stints.length - 1] : null;
                  const isBraking = car?.brake === 100;
                  const isOvertake = car?.drs === 8;
                  const radioUrl = activeRadios[driver.driver_number];

                  return (
                    <div key={driver.driver_number} className="grid grid-cols-12 gap-1 items-center p-1 text-xs hover:bg-[#0a0a0a]">
                      <div className="col-span-1 flex items-center justify-center">
                        <span className={`w-5 h-5 flex items-center justify-center font-bold text-[10px] ${
                          isBraking ? 'bg-red-600 text-white' : 'bg-[#1a1a1a] text-neutral-300'
                        }`}>
                          {index + 1}
                        </span>
                      </div>

                      <div className="col-span-2 relative h-6 bg-[#111] flex items-center px-1 overflow-hidden border border-[#222]">
                        <div
                          className="absolute left-0 top-0 bottom-0 opacity-40 transition-all duration-75"
                          style={{ width: `${car?.throttle || 0}%`, backgroundColor: driver.team_colour }}
                        />
                        <span className="relative z-10 text-[11px] font-black" style={{ color: driver.team_colour }}>
                          {driver.name_acronym}
                        </span>
                        <span className="relative z-10 ml-auto text-[9px] text-neutral-400">
                          #{driver.driver_number}
                        </span>
                      </div>

                      <div className="col-span-2 flex flex-col text-center text-[10px]">
                        <span className="text-neutral-200">{interval?.gap_to_leader ?? 'Leader'}</span>
                        <span className="text-neutral-500">{interval?.interval ?? 'Interval'}</span>
                      </div>

                      <div className="col-span-1 flex items-center justify-center space-x-1">
                        {currentStint ? (
                          <>
                            <span className={`w-3.5 h-3.5 rounded-full flex items-center justify-center text-[8px] font-black text-black ${
                              currentStint.compound === 'SOFT' ? 'bg-red-500' :
                              currentStint.compound === 'MEDIUM' ? 'bg-yellow-400' : 'bg-white'
                            }`}>
                              {currentStint.compound[0]}
                            </span>
                            <span className="text-[10px] text-neutral-300">{currentStint.tyre_age_at_start}</span>
                          </>
                        ) : <span className="text-[10px] text-neutral-600">--</span>}
                      </div>

                      <div className="col-span-2 flex flex-col text-center">
                        <span className="text-[10px] text-neutral-200">{formatLapTime(lap?.lap_duration)}</span>
                        <span className="text-[9px] text-neutral-500">{car?.speed ? `${car.speed} KM/H` : '--'}</span>
                      </div>

                      <div className="col-span-3 flex items-center justify-center space-x-0.5">
                        {[
                          ...(lap?.segments_sector_1 || []),
                          ...(lap?.segments_sector_2 || []),
                          ...(lap?.segments_sector_3 || [])
                        ].slice(0, 12).map((val, idx) => {
                          let bg = 'bg-[#222]';
                          if (val === 2051) bg = 'bg-[#b063ff]';
                          else if (val === 2049) bg = 'bg-[#00d2be]';
                          else if (val === 2048) bg = 'bg-yellow-400';
                          return <div key={idx} className={`w-1.5 h-3 ${bg}`} />;
                        })}
                      </div>

                      <div className="col-span-1 flex items-center justify-end space-x-1 pr-1">
                        {isOvertake && <span className="bg-[#b063ff] text-black font-black text-[8px] px-1 py-0.5">OVT</span>}
                        {radioUrl && (
                          <button onClick={() => new Audio(radioUrl).play()} className="text-[10px] text-white hover:text-red-500">
                            📻
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Canvas & Chart */}
            <div className="col-span-4 flex flex-col gap-1 overflow-hidden">
              <div className="h-1/2 bg-[#050505] border border-[#1a1a1a] relative">
                <div className="absolute top-1 left-2 text-[9px] text-neutral-500 z-10">TRACK MAP // 2D RADAR</div>
                <canvas ref={canvasRef} width="400" height="250" className="w-full h-full object-contain" />
              </div>

              <div className="h-1/2 bg-[#050505] border border-[#1a1a1a] p-1 flex flex-col">
                <span className="text-[9px] text-neutral-500 mb-1">POSITION TRACE</span>
                <div className="flex-1 w-full relative">
                  <canvas ref={chartRef} />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
